name: Flake

on:
  push:
    branches: [master]
    paths: ['go.mod', 'go.sum', 'flake.nix', 'flake.lock', 'nix/**', '**/*.go', 'package.json']
  pull_request:
    paths: ['go.mod', 'go.sum', 'flake.nix', 'flake.lock', 'nix/**', '**/*.go', 'package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: stubbedev/xilo@v2
        with:
          url: https://xilos.dev
          cache: stubbedev/main
          token: ${{ secrets.XILO_TOKEN }}

      # Recompute the Go module vendorHash from go.mod/go.sum. Setting it to a
      # fake value makes `nix build` fail and report the correct one, which we
      # then write back. Idempotent: a current hash converges to no change.
      - name: Recompute vendorHash
        run: |
          FAKE="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CUR="$(grep -oP 'vendorHash = "\K[^"]+' nix/package.nix)"
          sed -i "s#vendorHash = \"${CUR}\"#vendorHash = \"${FAKE}\"#" nix/package.nix
          OUT="$(nix build .#default --no-link 2>&1 || true)"
          GOT="$(printf '%s' "$OUT" | grep -oP 'got:\s+\K(sha256-\S+)' | head -1 || true)"
          [ -z "$GOT" ] && GOT="$CUR"
          sed -i "s#vendorHash = \"${FAKE}\"#vendorHash = \"${GOT}\"#" nix/package.nix
          echo "vendorHash = ${GOT}"
          # A build that fails without reporting a hash (wrong Go toolchain,
          # broken source) must fail the job instead of silently keeping the
          # old hash and surfacing later as "no paths to push".
          if ! nix build .#default --no-link 2>&1 | tail -20; then
            echo "::error::nix build fails for a reason other than a stale vendorHash"
            exit 1
          fi

      - name: Build check (compiles + runs go test via doCheck)
        run: |
          set -o pipefail
          nix build .#default --no-link

      - name: Commit updated vendorHash
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet nix/package.nix; then
            echo "vendorHash already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add nix/package.nix
            git commit -m "chore(nix): update vendorHash [skip ci]"
            git push
          fi
