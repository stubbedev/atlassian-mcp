name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: '7' }
          - { goos: linux, goarch: '386' }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: riscv64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: '386' }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          # Version is embedded from package.json (single source of truth) — no -X needed.
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          OUT="atlassian-mcp_${GOOS}_${GOARCH}${EXT}"
          go build -trimpath -ldflags "-s -w" -o "$OUT" .
          echo "ASSET=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Attach binaries to release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # MCP Bundles: one-click install in Claude Desktop (Settings -> Extensions).
      # Each bundle is manifest.json + that platform's binary, so the desktop app
      # needs no client JSON, no Node and no PATH fixing.
      - name: Pack .mcpb bundles
        run: |
          set -euo pipefail
          pack() { packaging/mcpb/pack.sh "dist/$1" "$2" "dist/atlassian-mcp_$3.mcpb"; }
          pack atlassian-mcp_darwin_arm64       darwin darwin_arm64
          pack atlassian-mcp_darwin_amd64       darwin darwin_amd64
          pack atlassian-mcp_windows_amd64.exe  win32  windows_amd64
          pack atlassian-mcp_windows_arm64.exe  win32  windows_arm64
          pack atlassian-mcp_linux_amd64        linux  linux_amd64
          pack atlassian-mcp_linux_arm64        linux  linux_arm64

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

  npm:
    name: Publish npm wrapper
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Publish to npm
        env:
          ATLASSIAN_MCP_SKIP_DOWNLOAD: '1'
        run: npm publish --provenance --access public
