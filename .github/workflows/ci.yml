name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o atlassian-mcp .

      # Real-binary smoke over stdio: a full MCP handshake (initialize →
      # initialized → tools/list) on the official SDK transport. Both services
      # are configured (via env) so the full tool set registers. The trailing
      # sleep keeps stdin open so the server flushes responses before EOF.
      # (In-process coverage of the same path lives in smoke_test.go.)
      - name: Smoke — MCP handshake over stdio
        run: |
          BIN="$PWD/atlassian-mcp"
          OUT="$({ printf '%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'; sleep 2; } \
            | JIRA_URL=https://example.com JIRA_ACCESS_TOKEN=smoke BITBUCKET_URL=https://example.com BITBUCKET_ACCESS_TOKEN=smoke "$BIN")"
          echo "$OUT"
          for tool in git_get_context get_dev_context jira_search bitbucket_get_pr complete_work; do
            echo "$OUT" | grep -q "\"name\":\"$tool\"" || { echo "smoke FAILED: missing tool $tool"; exit 1; }
          done
          echo "smoke OK"
