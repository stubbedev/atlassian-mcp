name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o atlassian-mcp .

      # The .mcpb packer only runs at release time, so exercise it here: a broken
      # manifest template or missing substitution would otherwise surface on tag day.
      - name: Pack .mcpb bundle
        run: |
          set -euo pipefail
          packaging/mcpb/pack.sh atlassian-mcp linux dist/atlassian-mcp_linux_amd64.mcpb
          unzip -p dist/atlassian-mcp_linux_amd64.mcpb manifest.json > manifest.out.json
          python3 - <<'EOF'
          import json
          m = json.load(open("manifest.out.json"))
          assert m["version"] == json.load(open("package.json"))["version"], m["version"]
          assert m["compatibility"]["platforms"] == ["linux"], m["compatibility"]
          assert "__" not in m["version"] + m["server"]["entry_point"], "unsubstituted token"
          print("mcpb manifest OK", m["version"])
          EOF

      # Real-binary smoke over stdio: a full MCP handshake (initialize →
      # initialized → tools/list) on the official SDK transport. Both services
      # are configured (via env) so the full tool set registers. The trailing
      # sleep keeps stdin open so the server flushes responses before EOF.
      # (In-process coverage of the same path lives in smoke_test.go.)
      - name: Smoke — MCP handshake over stdio
        run: |
          BIN="$PWD/atlassian-mcp"
          OUT="$({ printf '%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'; sleep 2; } \
            | JIRA_URL=https://example.com JIRA_ACCESS_TOKEN=smoke BITBUCKET_URL=https://example.com BITBUCKET_ACCESS_TOKEN=smoke "$BIN")"
          echo "$OUT"
          for tool in git_get_context get_dev_context jira_search bitbucket_get_pr complete_work; do
            echo "$OUT" | grep -q "\"name\":\"$tool\"" || { echo "smoke FAILED: missing tool $tool"; exit 1; }
          done
          echo "smoke OK"
