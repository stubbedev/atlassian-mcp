name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o atlassian-mcp .

      # Bitbucket tools are gated on the repo's origin remote matching the
      # configured instance host, so smoke from a temp repo whose remote host
      # matches BITBUCKET_URL to exercise the full tool set.
      - name: Smoke — tools/list
        run: |
          BIN="$PWD/atlassian-mcp"
          TMP="$(mktemp -d)"
          git -C "$TMP" init -q
          git -C "$TMP" remote add origin git@github.com:stubbedev/atlassian-mcp.git
          OUT="$(cd "$TMP" && printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | ATLASSIAN_MCP_CONFIG=/nonexistent JIRA_URL=https://github.com JIRA_ACCESS_TOKEN=smoke BITBUCKET_URL=https://github.com BITBUCKET_ACCESS_TOKEN=smoke "$BIN")"
          echo "$OUT" | node -e '
            let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
              const r=JSON.parse(d.trim());
              if(r.error)throw new Error("server error: "+r.error.message);
              const t=r.result?.tools;
              if(!Array.isArray(t)||!t.length)throw new Error("no tools in response");
              const bad=t.filter(x=>!x.name||!x.inputSchema);
              if(bad.length)throw new Error("malformed tools: "+bad.map(x=>x.name??"(unnamed)").join(", "));
              console.log("smoke OK — "+t.length+" tool(s): "+t.map(x=>x.name).join(", "));
            });'
